<h1 class="cart-title">

<div class="checkout-container">

```
<!-- CUSTOMER DETAILS -->

<div class="checkout-form">

    <h2>
        👤 Customer Details
    </h2>


    <form
        onsubmit="continueToPayment(event)"
    >


        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >


        <label for="address">
            Delivery Address
        </label>

        <textarea
            id="address"
            placeholder="Enter your complete address"
            required
        ></textarea>


        <label for="city">
            City
        </label>

        <input
            type="text"
            id="city"
            placeholder="Enter your city"
            required
        >


        <button
            type="submit"
            class="checkout-btn"
        >
            Continue To Payment 💳
        </button>


    </form>

</div>


<!-- ORDER SUMMARY -->

<div class="bill-box">

    <h2>
        🧾 Order Summary
    </h2>


    <div id="order-items">
    </div>


    <p>

        <span>
            Item Total
        </span>

        <span id="item-total">
            ₹0
        </span>

    </p>


    <p>

        <span>
            Delivery Fee
        </span>

        <span>
            ₹40
        </span>

    </p>


    <p class="grand-total">

        <span>
            Grand Total
        </span>

        <span id="grand-total">
            ₹40
        </span>

    </p>

</div>
```

</div>

<script>

function getCart() {

    return JSON.parse(
        localStorage.getItem("hungryCart")
    ) || [];

}


function displayOrderSummary() {

    const cart = getCart();

    const orderItems =
        document.getElementById("order-items");

    const itemTotalElement =
        document.getElementById("item-total");

    const grandTotalElement =
        document.getElementById("grand-total");


    if (cart.length === 0) {

        orderItems.innerHTML = `
            <p>Your cart is empty 🛒</p>
        `;

        itemTotalElement.innerText = "₹0";
        grandTotalElement.innerText = "₹40";

        return;
    }


    let itemTotal = 0;

    let html = "";


    cart.forEach(function(item) {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 1;

        const total =
            price * quantity;


        itemTotal += total;


        html += `

            <p>

                <span>
                    ${item.food} × ${quantity}
                </span>

                <span>
                    ₹${total}
                </span>

            </p>

        `;

    });


    const deliveryFee = 40;

    const grandTotal =
        itemTotal + deliveryFee;


    orderItems.innerHTML = html;

    itemTotalElement.innerText =
        "₹" + itemTotal;

    grandTotalElement.innerText =
        "₹" + grandTotal;

}


function continueToPayment(event) {

    event.preventDefault();


    const cart = getCart();


    if (cart.length === 0) {

        alert(
            "Your cart is empty! 🛒"
        );

        window.location.href =
            "stores.html";

        return;

    }


    const customer = {

        name:
            document.getElementById("name")
            .value
            .trim(),

        phone:
            document.getElementById("phone")
            .value
            .trim(),

        address:
            document.getElementById("address")
            .value
            .trim(),

        city:
            document.getElementById("city")
            .value
            .trim()

    };


    localStorage.setItem(
        "hungryCustomer",
        JSON.stringify(customer)
    );


    window.location.href =
        "payment.html";

}


displayOrderSummary();

</script>

</body>

</html>
