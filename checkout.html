<h1 class="cart-title">

```
<!-- CUSTOMER DETAILS -->

<div class="checkout-form">


    <h2>
        👤 Customer Details
    </h2>


    <form onsubmit="continueToPayment(event)">


        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            required
        >


        <label for="address">
            Delivery Address
        </label>

        <textarea
            id="address"
            placeholder="Enter your complete address"
            required
        ></textarea>


        <label for="city">
            City
        </label>

        <input
            type="text"
            id="city"
            placeholder="Enter your city"
            required
        >


        <button
            type="submit"
            class="checkout-btn"
        >
            Continue To Payment 💳
        </button>


    </form>


</div>


<!-- ORDER SUMMARY -->

<div class="bill-box">


    <h2>
        🧾 Order Summary
    </h2>


    <div id="order-items">

    </div>


    <p>

        <span>
            Item Total
        </span>

        <span id="item-total">
            ₹0
        </span>

    </p>


    <p>

        <span>
            Delivery Fee
        </span>

        <span>
            ₹40
        </span>

    </p>


    <p class="grand-total">

        <span>
            Grand Total
        </span>

        <span id="grand-total">
            ₹40
        </span>

    </p>


</div>
```

</div>

<script>


/* ========================= */
/* LOAD CART */
/* ========================= */


function getCart() {


    return JSON.parse(
        localStorage.getItem("hungryCart")
    ) || [];


}


/* ========================= */
/* DISPLAY ORDER SUMMARY */
/* ========================= */


function loadSummary() {


    let cart = getCart();


    let itemsContainer =
        document.getElementById(
            "order-items"
        );


    let itemTotal = 0;


    if (cart.length === 0) {


        itemsContainer.innerHTML = `

            <p>
                Your cart is empty.
            </p>

        `;


        document.getElementById(
            "item-total"
        ).innerText = "₹0";


        document.getElementById(
            "grand-total"
        ).innerText = "₹0";


        return;

    }


    let html = "";


    cart.forEach(function(item) {


        let price =
            Number(item.price) || 0;


        let quantity =
            Number(item.quantity) || 1;


        let total =
            price * quantity;


        itemTotal += total;


        html += `

            <p>

                <span>
                    ${item.food} × ${quantity}
                </span>

                <span>
                    ₹${total}
                </span>

            </p>

        `;

    });


    let deliveryFee = 40;


    let grandTotal =
        itemTotal + deliveryFee;


    itemsContainer.innerHTML = html;


    document.getElementById(
        "item-total"
    ).innerText =
        "₹" + itemTotal;


    document.getElementById(
        "grand-total"
    ).innerText =
        "₹" + grandTotal;

}


/* ========================= */
/* CONTINUE TO PAYMENT */
/* ========================= */


function continueToPayment(event) {


    event.preventDefault();


    let cart = getCart();


    if (cart.length === 0) {


        alert(
            "Your cart is empty! 🛒"
        );


        window.location.href =
            "menu.html";


        return;

    }


    let customer = {


        name:
            document.getElementById(
                "name"
            ).value,


        phone:
            document.getElementById(
                "phone"
            ).value,


        address:
            document.getElementById(
                "address"
            ).value,


        city:
            document.getElementById(
                "city"
            ).value

    };


    localStorage.setItem(

        "hungryCustomer",

        JSON.stringify(customer)

    );


    window.location.href =
        "payment.html";

}


loadSummary();


</script>

</body>

</html>
