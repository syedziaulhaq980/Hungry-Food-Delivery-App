<body>

<h1 class="cart-title">
    💳 Payment
</h1>

<div class="payment-box">

```
<h2>
    Choose Payment Method
</h2>


<p id="customer-name"></p>


<form onsubmit="confirmOrder(event)">


    <label>

        <input
            type="radio"
            name="payment"
            value="COD"
            required
        >

        💵 Cash On Delivery

    </label>


    <label>

        <input
            type="radio"
            name="payment"
            value="UPI"
        >

        📱 UPI Payment

    </label>


    <label>

        <input
            type="radio"
            name="payment"
            value="Card"
        >

        💳 Card Payment

    </label>


    <h3>

        Total Amount :

        <span id="total-amount">
            ₹0
        </span>

    </h3>


    <button
        type="submit"
        class="checkout-btn"
    >
        Confirm Order
    </button>


</form>
```

</div>

<script>


/* ========================= */
/* GET CART */
/* ========================= */


function getCart() {


    return JSON.parse(
        localStorage.getItem("hungryCart")
    ) || [];


}


/* ========================= */
/* CALCULATE TOTAL */
/* ========================= */


function calculateTotal() {


    let cart = getCart();


    let total = 0;


    cart.forEach(function(item) {


        let price =
            Number(item.price) || 0;


        let quantity =
            Number(item.quantity) || 1;


        total +=
            price * quantity;

    });


    let deliveryFee = 40;


    return total + deliveryFee;

}


/* ========================= */
/* LOAD CUSTOMER */
/* ========================= */


function loadPaymentData() {


    let customer =
        JSON.parse(
            localStorage.getItem(
                "hungryCustomer"
            )
        );


    if (customer) {


        document.getElementById(
            "customer-name"
        ).innerText =
            "Order for " +
            customer.name;

    }


    let total =
        calculateTotal();


    document.getElementById(
        "total-amount"
    ).innerText =
        "₹" + total;


}


/* ========================= */
/* CONFIRM ORDER */
/* ========================= */


function confirmOrder(event) {


    event.preventDefault();


    let selectedPayment =
        document.querySelector(
            'input[name="payment"]:checked'
        );


    if (!selectedPayment) {


        alert(
            "Please select a payment method."
        );


        return;

    }


    let paymentMethod =
        selectedPayment.value;


    let cart = getCart();


    if (cart.length === 0) {


        alert(
            "Your cart is empty! 🛒"
        );


        window.location.href =
            "menu.html";


        return;

    }


    let customer =
        JSON.parse(
            localStorage.getItem(
                "hungryCustomer"
            )
        ) || {};


    let order = {


        id:
            "HUNGRY-" +
            Date.now(),


        customer:
            customer,


        items:
            cart,


        payment:
            paymentMethod,


        total:
            calculateTotal(),


        date:
            new Date().toLocaleString()

    };


    /* SAVE ORDER */

    let orders =
        JSON.parse(
            localStorage.getItem(
                "hungryOrders"
            )
        ) || [];


    orders.push(order);


    localStorage.setItem(
        "hungryOrders",
        JSON.stringify(orders)
    );


    /* SAVE CURRENT ORDER */

    localStorage.setItem(
        "hungryCurrentOrder",
        JSON.stringify(order)
    );


    /* CLEAR CART */

    localStorage.removeItem(
        "hungryCart"
    );


    /* GO TO SUCCESS PAGE */

    window.location.href =
        "order_success.html";

}


loadPaymentData();


</script>

</body>

</html>
