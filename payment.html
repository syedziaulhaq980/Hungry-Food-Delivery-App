<!DOCTYPE html>

<html lang="en">

<head>

<title>Hungry - Payment</title>

<link rel="stylesheet" href="static/style.css">
```

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

```
<div class="logo">
    🍔 Hungry
</div>


<div class="nav-links">

    <a href="index.html">
        🏠 Home
    </a>

    <a href="stores.html">
        🍴 Stores

    <a href="food_menu.html">

    </a>

</div>
```

</div>

<!-- PAYMENT -->

<div class="payment-box">

```
<h1 class="cart-title">
    💳 Payment
</h1>


<h2>
    Choose Payment Method
</h2>


<p id="customer-name">
</p>


<form
    onsubmit="confirmOrder(event)"
>


    <label>

        <input
            type="radio"
            name="payment"
            value="COD"
            required
        >

        💵 Cash On Delivery

    </label>


    <label>

        <input
            type="radio"
            name="payment"
            value="UPI"
        >

        📱 UPI Payment

    </label>


    <label>

        <input
            type="radio"
            name="payment"
            value="Card"
        >

        💳 Card Payment

    </label>


    <h3>

        Total Amount:

        <span id="total-amount">
            ₹0
        </span>

    </h3>


    <button
        type="submit"
        class="checkout-btn"
    >
        Confirm Order
    </button>


</form>
```

</div>

<script>

function getCart() {

    return JSON.parse(
        localStorage.getItem("hungryCart")
    ) || [];

}


function getCustomer() {

    return JSON.parse(
        localStorage.getItem("hungryCustomer")
    ) || null;

}


function calculateTotal() {

    const cart = getCart();

    let itemTotal = 0;


    cart.forEach(function(item) {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 1;

        itemTotal +=
            price * quantity;

    });


    return itemTotal + 40;

}


function displayPaymentDetails() {

    const customer =
        getCustomer();


    const total =
        calculateTotal();


    document.getElementById(
        "total-amount"
    ).innerText =
        "₹" + total;


    if (customer) {

        document.getElementById(
            "customer-name"
        ).innerText =
            "👤 Customer: " + customer.name;

    }

}


function confirmOrder(event) {

    event.preventDefault();


    const cart =
        getCart();


    const customer =
        getCustomer();


    const payment =
        document.querySelector(
            'input[name="payment"]:checked'
        ).value;


    if (cart.length === 0) {

        alert(
            "Your cart is empty! 🛒"
        );

        window.location.href =
            "stores.html";

        return;

    }


    const total =
        calculateTotal();


    const order = {

        id:
            Date.now(),

        customer:
            customer,

        items:
            cart,

        payment:
            payment,

        total:
            total,

        date:
            new Date().toLocaleString()

    };


    let orders =
        JSON.parse(
            localStorage.getItem("hungryOrders")
        ) || [];


    orders.push(order);


    localStorage.setItem(
        "hungryOrders",
        JSON.stringify(orders)
    );


    // Clear cart after successful order

    localStorage.removeItem(
        "hungryCart"
    );


    // Go to success page

    window.location.href =
        "order_success.html";

}


displayPaymentDetails();

</script>

</body>

</html>
