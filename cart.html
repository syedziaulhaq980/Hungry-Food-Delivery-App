<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Hungry - Cart</title>

<link rel="stylesheet" href="static/style.css">
```

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

```
<div class="logo">
    🍔 Hungry
</div>


<div class="nav-links">

    <a href="index.html">
        🏠 Home
    </a>

    <a href="stores.html">
        🍴 Stores
    </a>

    <a href="menu.html">
        🍽️ Menu
    </a>

    <a href="orders.html">
        📦 My Orders
    </a>

    <a href="cart.html" class="active">
        🛒 Cart
    </a>

</div>
```

</div>

<h1 class="cart-title">
    🛒 Your Cart
</h1>

<div id="cart-content">

</div>

<script>


function loadCart() {


    let cart =
        JSON.parse(
            localStorage.getItem("hungryCart")
        ) || [];


    let container =
        document.getElementById(
            "cart-content"
        );


    /* EMPTY CART */

    if (cart.length === 0) {


        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🛒
                </div>

                <h2>
                    Your Cart Is Empty
                </h2>

                <p>
                    Looks like you haven't added
                    anything to your cart yet.
                </p>

                <a href="menu.html">
                    Start Ordering
                </a>

            </div>

        `;


        return;

    }


    let total = 0;


    let itemsHTML = "";


    cart.forEach(function(item, index) {


        let quantity =
            Number(item.quantity) || 1;


        let price =
            Number(item.price) || 0;


        let itemTotal =
            price * quantity;


        total += itemTotal;


        itemsHTML += `

            <div class="cart-card">


                <div class="cart-food-info">


                    <div class="food-icon">
                        🍽️
                    </div>


                    <div>

                        <h2>
                            ${item.food}
                        </h2>

                        <p>
                            ₹${price}
                        </p>

                    </div>


                </div>


                <div class="quantity-box">

                    Qty: ${quantity}

                </div>


                <div class="item-total">

                    ₹${itemTotal}

                </div>


                <button
                    onclick="removeItem(${index})"
                    style="
                        border:none;
                        background:none;
                        color:#ff5200;
                        font-size:20px;
                        cursor:pointer;
                    "
                >
                    ❌
                </button>


            </div>

        `;


    });


    container.innerHTML = `

        <div class="cart-container">


            ${itemsHTML}


            <div class="bill-box">

                <h2>
                    🧾 Bill Details
                </h2>


                <p>

                    <span>
                        Item Total
                    </span>

                    <span>
                        ₹${total}
                    </span>

                </p>


                <p>

                    <span>
                        Delivery Fee
                    </span>

                    <span>
                        ₹40
                    </span>

                </p>


                <p class="grand-total">

                    <span>
                        Grand Total
                    </span>

                    <span>
                        ₹${total + 40}
                    </span>

                </p>


                <a
                    href="checkout.html"
                    class="checkout-btn"
                >
                    Proceed To Checkout
                </a>


            </div>


        </div>


        <a
            href="menu.html"
            class="continue-btn"
        >
            ← Continue Shopping
        </a>

    `;


}


function removeItem(index) {


    let cart =
        JSON.parse(
            localStorage.getItem("hungryCart")
        ) || [];


    cart.splice(index, 1);


    localStorage.setItem(
        "hungryCart",
        JSON.stringify(cart)
    );


    loadCart();

}


loadCart();


</script>

</body>

</html>
