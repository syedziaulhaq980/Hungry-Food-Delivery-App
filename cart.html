<html lang="en">

<head>

```
<meta charset="UTF-8">

      content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="static/style.css">
```

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

```
<div class="logo">
    🍔 Hungry

<div class="nav-links">

    <a href="index.html">

```

</div>

<h1 class="cart-title">
    🛒 Your Cart
</h1>

<div
    id="cart-container"
    class="cart-container"
>
</div>

<script>


/* ========================= */
/* GET CART */
/* ========================= */


function getCart() {


    return JSON.parse(
        localStorage.getItem(
            "hungryCart"
        )
    ) || [];

}


/* ========================= */
/* SAVE CART */
/* ========================= */


function saveCart(cart) {


    localStorage.setItem(
        "hungryCart",
        JSON.stringify(cart)
    );

}


/* ========================= */
/* UPDATE CART COUNT */
/* ========================= */


function updateCartCount(cart) {


    let count = 0;


    cart.forEach(function(item) {


        count +=
            Number(item.quantity) || 1;

    });


    document.getElementById(
        "cart-count"
    ).innerText = count;

}


/* ========================= */
/* INCREASE */
/* ========================= */


function increaseQuantity(index) {


    let cart = getCart();


    cart[index].quantity =
        (Number(cart[index].quantity) || 1) + 1;


    saveCart(cart);


    displayCart();

}


/* ========================= */
/* DECREASE */
/* ========================= */


function decreaseQuantity(index) {


    let cart = getCart();


    let quantity =
        Number(cart[index].quantity) || 1;


    if (quantity > 1) {


        cart[index].quantity =
            quantity - 1;


    } else {


        cart.splice(index, 1);

    }


    saveCart(cart);


    displayCart();

}


/* ========================= */
/* REMOVE */
/* ========================= */


function removeItem(index) {


    let cart = getCart();


    cart.splice(index, 1);


    saveCart(cart);


    displayCart();

}


/* ========================= */
/* DISPLAY CART */
/* ========================= */


function displayCart() {


    let cart = getCart();


    let container =
        document.getElementById(
            "cart-container"
        );


    updateCartCount(cart);


    /* EMPTY CART */


    if (cart.length === 0) {


        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🛒
                </div>

                <h2>
                    Your Cart Is Empty
                </h2>

                <p>
                    Add something delicious to your cart!
                </p>

                <a href="stores.html">
                    Start Ordering
                </a>

            </div>

        `;


        return;

    }


    let subtotal = 0;


    let itemsHTML = "";


    cart.forEach(function(item, index) {


        let price =
            Number(item.price) || 0;


        let quantity =
            Number(item.quantity) || 1;


        let total =
            price * quantity;


        subtotal += total;


        itemsHTML += `

            <div class="cart-card">


                <div class="cart-food-info">


                    <div class="food-icon">
                        🛍️
                    </div>


                    <div>

                        <h2>
                            ${item.food}
                        </h2>


                        <p>
                            ₹${price} each
                        </p>


                    </div>


                </div>


                <div
                    class="quantity-box"
                >

                    <button
                        onclick="decreaseQuantity(${index})"
                        style="
                            border:none;
                            background:none;
                            cursor:pointer;
                            font-size:20px;
                        "
                    >
                        −
                    </button>


                    ${quantity}


                    <button
                        onclick="increaseQuantity(${index})"
                        style="
                            border:none;
                            background:none;
                            cursor:pointer;
                            font-size:20px;
                        "
                    >
                        +
                    </button>

                </div>


                <div class="item-total">

                    ₹${total}

                </div>


                <button
                    onclick="removeItem(${index})"
                    style="
                        border:none;
                        background:#ffe5dc;
                        color:#ff5200;
                        padding:8px 12px;
                        border-radius:20px;
                        cursor:pointer;
                    "
                >
                    Remove
                </button>


            </div>

        `;

    });


    let deliveryFee = 40;


    let grandTotal =
        subtotal + deliveryFee;


    container.innerHTML = `

        ${itemsHTML}


        <div class="bill-box">


            <h2>
                🧾 Bill Details
            </h2>


            <p>

                <span>
                    Subtotal
                </span>

                <span>
                    ₹${subtotal}
                </span>

            </p>


            <p>

                <span>
                    Delivery Fee
                </span>

                <span>
                    ₹${deliveryFee}
                </span>

            </p>


            <p class="grand-total">

                <span>
                    Grand Total
                </span>

                <span>
                    ₹${grandTotal}
                </span>

            </p>


            <a
                href="checkout.html"
                class="checkout-btn"
            >
                Proceed To Checkout
            </a>


        </div>


        <a
            href="stores.html"
            class="continue-btn"
        >
            ← Continue Shopping
        </a>

    `;

}


displayCart();


</script>

</body>

</html>
