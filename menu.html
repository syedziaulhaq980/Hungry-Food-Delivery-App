<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hungry - Menu</title>

    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <div class="logo">
        🍔 Hungry
    </div>

    <div class="nav-links">

        <a href="stores.html">
            🍴 Stores
        </a>

        <a href="menu.html" class="active">
            🍽️ Menu
        </a>

        <a href="orders.html">
            📦 My Orders
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </div>


    <h1>🍽️ Delicious Menu</h1>

    <p>Choose your favourite food</p>


    <div class="menu-container">


        <div class="food-item">

            <img
                src="static/images/chicken_biryani.jpg"
                class="food-item-image"
                alt="Chicken Biryani"
            >

            <h2>Chicken Biryani</h2>

            <p>₹220</p>

            <button onclick="addToCart('Chicken Biryani', 220)">
                Add
            </button>

        </div>


        <div class="food-item">

            <img
                src="static/images/butter_chicken.jpg"
                class="food-item-image"
                alt="Butter Chicken"
            >

            <h2>Butter Chicken</h2>

            <p>₹280</p>

            <button onclick="addToCart('Butter Chicken', 280)">
                Add
            </button>

        </div>


        <div class="food-item">

            <img
                src="static/images/paneer_tikka.jpg"
                class="food-item-image"
                alt="Paneer Tikka"
            >

            <h2>Paneer Tikka</h2>

            <p>₹200</p>

            <button onclick="addToCart('Paneer Tikka', 200)">
                Add
            </button>

        </div>


        <div class="food-item">

            <img
                src="static/images/veg_biryani.jpg"
                class="food-item-image"
                alt="Veg Biryani"
            >

            <h2>Veg Biryani</h2>

            <p>₹180</p>

            <button onclick="addToCart('Veg Biryani', 180)">
                Add
            </button>

        </div>


        <div class="food-item">

            <img
                src="static/images/chicken_tikka.jpg"
                class="food-item-image"
                alt="Chicken Tikka"
            >

            <h2>Chicken Tikka</h2>

            <p>₹240</p>

            <button onclick="addToCart('Chicken Tikka', 240)">
                Add
            </button>

        </div>


        <div class="food-item">

            <img
                src="static/images/dal_makhani.jpg"
                class="food-item-image"
                alt="Dal Makhani"
            >

            <h2>Dal Makhani</h2>

            <p>₹160</p>

            <button onclick="addToCart('Dal Makhani', 160)">
                Add
            </button>

        </div>


    </div>


    <br>

    <a href="stores.html">
        ← Back To Stores
    </a>


    <script>

        function addToCart(food, price) {

            let cart =
                JSON.parse(localStorage.getItem("hungryCart")) || [];

            cart.push({
                food: food,
                price: price
            });

            localStorage.setItem(
                "hungryCart",
                JSON.stringify(cart)
            );

            alert(food + " added to cart! 🛒");

        }

    </script>

</body>

</html>
